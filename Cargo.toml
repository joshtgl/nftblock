[workspace]
resolver = "2"
members = [".", "cidrwall-common", "cidrwall-ebpf"]
default-members = [".", "cidrwall-common"]

[package]
name = "cidrwall"
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Atomically enforce CIDR blocklists with nftables and XDP"
repository = "https://github.com/joshtgl/cidrwall"
include = ["src/**", "build.rs", "README.md", "CHANGELOG.md", "config/**"]

[features]
default = ["native-netlink", "xdp"]
native-netlink = ["dep:nftnl", "dep:mnl"]
xdp = ["dep:aya", "dep:cidrwall-common", "dep:cidrwall-ebpf"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
env_logger = "0.11.11"
ipnet = { version = "2.12.2", features = ["serde"] }
log = "0.4.34"
notify = "8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
thiserror = "2.0.20"
toml = "1.1.5"
nftnl = { version = "0.9.4", optional = true, features = ["nftnl-1-1-6"] }
mnl = { version = "0.3.1", optional = true }
aya = { version = "0.14.0", optional = true }
cidrwall-common = { version = "=0.1.3", path = "cidrwall-common", optional = true, features = ["user"] }

[build-dependencies]
anyhow = "1.0.104"
aya-build = "0.2.0"
cargo_metadata = "0.23.1"
cidrwall-ebpf = { version = "=0.1.3", path = "cidrwall-ebpf", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.release.package.cidrwall-ebpf]
debug = 2
codegen-units = 1
