[package]
name = "nftblock"
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Atomically apply CIDR lists with nftables netlink batches"

[features]
default = ["native-netlink"]
native-netlink = ["dep:nftnl", "dep:mnl"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
env_logger = "0.11.11"
ipnet = { version = "2.12.1", features = ["serde"] }
log = "0.4.33"
notify = "8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
thiserror = "2.0.20"
toml = "1.1.4"
nftnl = { version = "0.9.4", optional = true, features = ["nftnl-1-1-6"] }
mnl = { version = "0.3.1", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.release]
lto = true
strip = true
codegen-units = 1
