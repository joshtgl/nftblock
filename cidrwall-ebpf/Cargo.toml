[package]
name = "cidrwall-ebpf"
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "XDP filtering program for cidrwall"
repository = "https://github.com/joshtgl/cidrwall"

[features]
default = []
program = ["dep:aya-ebpf", "dep:cidrwall-common"]

[dependencies]
aya-ebpf = { version = "0.2.1", optional = true }
cidrwall-common = { version = "=0.1.3", path = "../cidrwall-common", optional = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "cidrwall"
path = "src/main.rs"
test = false
bench = false
required-features = ["program"]
